# Save this file as: .github/workflows/build.yml
# Put video_downloader.py in the root of the repo, then run it from the Actions tab.

name: Build apps

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pyinstaller "yt-dlp[default,curl-cffi]"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name VideoDownloader --collect-all yt_dlp --collect-all curl_cffi video_downloader.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name VideoDownloader --collect-all yt_dlp --collect-all curl_cffi video_downloader.py
          ditto -c -k --sequesterRsrc --keepParent dist/VideoDownloader.app dist/VideoDownloader-mac.zip

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-windows
          path: dist/VideoDownloader.exe

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-mac
          path: dist/VideoDownloader-mac.zip
